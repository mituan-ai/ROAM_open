# Copy this file to configs/llm.local.yaml and fill your real API key for local runs.
# 本地运行时请复制为 configs/llm.local.yaml 并填写真实 API key；若本地文件存在，脚本会优先读取它。
type: openai_compatible
api_url: "https://api.deepseek.com/v1"
api_key: ""
model: deepseek-reasoner
timeout_seconds: 180
temperature: 0.0
max_tokens: null
max_attempts: 3
retry_backoff_seconds: 1.0
enable_cache: true
fail_on_invalid_response: true
response_format_json_object: true
